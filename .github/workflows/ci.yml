name: TextNo CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r backend/requirements.txt
        pip install -r frontend/requirements.txt

    - name: Lint with flake8
      run: |
        # 1. Bắt các lỗi nghiêm trọng (cú pháp sai, biến chưa định nghĩa) -> Báo Fail ngay lập tức
        flake8 backend/ frontend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        
        # 2. Kiểm tra các lỗi format code (cảnh báo nhưng không làm hỏng build)
        flake8 backend/ frontend/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Create dummy .env file
      run: touch backend/.env

    - name: Test Docker Compose Build
      run: docker-compose build